<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cap All in or Nothing | Satoshi Lounge Shop</title>
<meta name="description" content="Cap All in or Nothing – Cuervo Apparel, Satoshi Lounge Merch.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23f97316'/><text x='16' y='23' font-size='20' font-family='sans-serif' font-weight='800' text-anchor='middle' fill='%231a0f06'>S</text></svg>">
<link rel="stylesheet" href="../style.a751cc0cfe.css">
<style>
  .product-page-wrap{max-width:640px;margin:80px auto;padding:0 24px;text-align:center}
  .product-page-wrap img{width:100%;max-width:360px;border-radius:var(--r-xl,18px);margin-bottom:24px}
</style>
</head>
<body>
<header class="site-header"><div class="wrap"><nav class="nav">
  <a class="brand" href="../index.html"><span class="mark"><span>S</span></span> Satoshi Lounge</a>
  <div class="nav-links"><a href="../shop.html">Zurück zum Shop</a></div>
</nav></div></header>
<main>
  <div class="product-page-wrap">
    <img src="../assets/cae08e_25d29b47d6554db19a1d2a37f67d98a1.jpg" alt="Cap All in or Nothing">
    <h1 class="h-lg">Cap All in or Nothing</h1>
    <p class="lead">24.99 €</p>
    <button class="btn btn-ember" id="buyBtn" data-product-id="cap-all-in-or-nothing" style="cursor:pointer;border:none;">Jetzt kaufen</button>
    <p id="buyMsg" style="color:#ff6b6b;font-size:0.85rem;margin-top:10px;min-height:1em;"></p>
    <script>
      document.getElementById("buyBtn").addEventListener("click", async function(){
        var btn = this, msg = document.getElementById("buyMsg");
        var sizeEl = document.getElementById("sizeSelect");
        var size = sizeEl ? sizeEl.value : undefined;
        if(sizeEl && !size){ msg.textContent = "Bitte zuerst eine Größe wählen."; return; }
        msg.textContent = ""; btn.disabled = true; btn.textContent = "Einen Moment…";
        try{
          var res = await fetch("/api/create-checkout-session", {
            method: "POST", headers: {"Content-Type":"application/json"},
            body: JSON.stringify({ productId: btn.dataset.productId, size: size })
          });
          var data = await res.json();
          if(data.url){ window.location.href = data.url; }
          else{ msg.textContent = data.error || "Fehler beim Checkout."; btn.disabled = false; btn.textContent = "Jetzt kaufen"; }
        }catch(e){
          msg.textContent = "Verbindung fehlgeschlagen. Versuch es nochmal."; btn.disabled = false; btn.textContent = "Jetzt kaufen";
        }
      });
    </script>
    <p style="margin-top:24px"><a href="../shop.html">&larr; Zurück zum Shop</a></p>
  </div>
</main>
</body>
</html>
