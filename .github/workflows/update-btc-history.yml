name: BTC-Historie aktualisieren

on:
  schedule:
    # Täglich um 03:15 Uhr UTC (ca. 04:15/05:15 deutscher Zeit, je nach Sommer-/Winterzeit)
    - cron: "15 3 * * *"
  workflow_dispatch: {}   # erlaubt manuelles Anstoßen über den "Run workflow"-Button auf GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Historie neu laden
        run: node scripts/update-btc-history.js

      - name: Änderungen committen (nur falls sich was geändert hat)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add satoshi-lounge-website/btc-history.json
          git diff --staged --quiet || git commit -m "Automatisches Update: BTC-Historie"
          git push
